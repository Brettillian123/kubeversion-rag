{{- if .Values.ingest.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kvrag.fullname" . }}-corpus
  labels:
    {{- include "kvrag.labels" . | nindent 4 }}
  annotations:
    # The corpus outlives any single release. Deleting it on `helm uninstall` would
    # mean re-cloning twelve release branches to get back to where you were.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.ingest.persistence.accessMode }}
  {{- if .Values.ingest.persistence.storageClassName }}
  storageClassName: {{ .Values.ingest.persistence.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.ingest.persistence.size }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "kvrag.fullname" . }}-ingest
  labels:
    {{- include "kvrag.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest
spec:
  schedule: {{ .Values.ingest.schedule | quote }}
  # Ingestion is not idempotent against itself: two concurrent runs share one git
  # checkout directory and would check out different branches underneath each other.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      # 2 hours: a cold run clones twelve branches. Without a deadline a wedged git
      # fetch would hold the Forbid lock and silently suppress every later run.
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            {{- include "kvrag.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: ingest
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ include "kvrag.serviceAccountName" . }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: ingest
              image: {{ include "kvrag.image" (dict "component" "jobs" "Values" .Values) }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args:
                - kubeversion_rag.cli
                - --min-version
                - {{ .Values.corpus.minVersion | quote }}
                - --max-version
                - {{ .Values.corpus.maxVersion | quote }}
                - ingest
              envFrom:
                - configMapRef:
                    name: {{ include "kvrag.fullname" . }}-config
              env:
                # git resolves a config file under $HOME. The image's user has no home
                # directory, and with readOnlyRootFilesystem git fails to write its
                # lockfile -- a clone error that reads like a network problem.
                - name: HOME
                  value: /tmp
              resources:
                {{- toYaml .Values.ingest.resources | nindent 16 }}
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              volumeMounts:
                - name: corpus
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: corpus
              persistentVolumeClaim:
                claimName: {{ include "kvrag.fullname" . }}-corpus
            - name: tmp
              emptyDir: {}
{{- end }}
{{- if .Values.backfill.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  # Name includes the model and revision so re-running the backfill for a different
  # model does not collide with a completed Job of the same name (Job specs are
  # immutable, so a plain name would fail the second time).
  name: {{ include "kvrag.fullname" . }}-backfill-{{ .Values.backfill.revision }}
  labels:
    {{- include "kvrag.labels" . | nindent 4 }}
    app.kubernetes.io/component: backfill
  annotations:
    helm.sh/hook-weight: "5"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 10800
  template:
    metadata:
      labels:
        {{- include "kvrag.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backfill
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "kvrag.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: backfill
          image: {{ include "kvrag.image" (dict "component" "jobs" "Values" .Values) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python"]
          args:
            - scripts/migrate_embedding_model.py
            - backfill
            - --model
            - {{ .Values.backfill.model | quote }}
            - --revision
            - {{ .Values.backfill.revision | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "kvrag.fullname" . }}-config
          resources:
            {{- toYaml .Values.backfill.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: corpus
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: corpus
          persistentVolumeClaim:
            claimName: {{ include "kvrag.fullname" . }}-corpus
        - name: tmp
          emptyDir: {}
{{- end }}
