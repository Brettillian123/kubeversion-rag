apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kvrag.fullname" . }}-config
  labels:
    {{- include "kvrag.labels" . | nindent 4 }}
  annotations:
    # The migration script patches KVRAG_COLLECTION here and then rolls the API
    # deployment. Helm must not revert that on the next `helm upgrade`, or a promoted
    # model would silently roll back the first time anyone changes an unrelated value.
    helm.sh/resource-policy: keep
    kubeversion-rag/managed-by-migration: "KVRAG_COLLECTION is owned by scripts/migrate_embedding_model.py"
data:
  KVRAG_COLLECTION: {{ .Values.activeCollection | quote }}
  KVRAG_QDRANT_URL: {{ include "kvrag.qdrantUrl" . | quote }}
  KVRAG_EMBED_URL: {{ include "kvrag.embedUrl" . | quote }}
  KVRAG_MODEL: {{ .Values.anthropic.model | quote }}
  KVRAG_MIN_VERSION: {{ .Values.corpus.minVersion | quote }}
  KVRAG_MAX_VERSION: {{ .Values.corpus.maxVersion | quote }}
  KVRAG_EMBED_MODEL: {{ .Values.embed.model | quote }}
