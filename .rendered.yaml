apiVersion: apps/v1
kind: Deployment
metadata:
  name: kvrag-kubeversion-rag-api
  labels:
    helm.sh/chart: kubeversion-rag-0.1.0
    app.kubernetes.io/name: kubeversion-rag
    app.kubernetes.io/instance: kvrag
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeversion-rag
      app.kubernetes.io/instance: kvrag
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeversion-rag
        app.kubernetes.io/instance: kvrag
        app.kubernetes.io/component: api
      annotations:
        # This is load-bearing for the migration flow: `migrate promote` patches
        # KVRAG_COLLECTION in the ConfigMap, and a `helm upgrade` that changes it must
        # also roll the pods. (The migration script issues its own rollout restart, so
        # the two paths agree.)
        checksum/config: 85beb00e3316c0683b051e20e93af34784b3477e34b5c487787e36b91fa88c95
    spec:
      serviceAccountName: kvrag-kubeversion-rag
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/kubeversion-rag/api:ci
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: kvrag-kubeversion-rag-config
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kvrag-anthropic
                  key: ANTHROPIC_API_KEY
          livenessProbe:
            # Process-only. Deliberately NOT dependent on Qdrant: if liveness checked
            # the dependency, a Qdrant blip would restart every API pod simultaneously
            # and convert a degraded dependency into a full outage.
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            # Checks that the active collection exists and is non-empty, so a pod
            # pointed at an unbackfilled collection never receives traffic.
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 20
            periodSeconds: 3
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      # Give in-flight requests time to finish before the container is killed. A
      # generation call can legitimately take several seconds, and the default 30s
      # grace period truncates them during every rollout.
      terminationGracePeriodSeconds: 60
