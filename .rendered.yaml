apiVersion: batch/v1
kind: Job
metadata:
  # Name includes the model and revision so re-running the backfill for a different
  # model does not collide with a completed Job of the same name (Job specs are
  # immutable, so a plain name would fail the second time).
  name: kvrag-kubeversion-rag-backfill-1
  labels:
    helm.sh/chart: kubeversion-rag-0.1.0
    app.kubernetes.io/name: kubeversion-rag
    app.kubernetes.io/instance: kvrag
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: backfill
  annotations:
    helm.sh/hook-weight: "5"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 10800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeversion-rag
        app.kubernetes.io/instance: kvrag
        app.kubernetes.io/component: backfill
    spec:
      restartPolicy: OnFailure
      serviceAccountName: kvrag-kubeversion-rag
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backfill
          image: ghcr.io/kubeversion-rag/jobs:ci
          imagePullPolicy: IfNotPresent
          command: ["python"]
          args:
            - scripts/migrate_embedding_model.py
            - backfill
            - --model
            - "BAAI/bge-small-en-v1.5"
            - --revision
            - "1"
          envFrom:
            - configMapRef:
                name: kvrag-kubeversion-rag-config
          resources:
            limits:
              memory: 8Gi
            requests:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: corpus
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: corpus
          persistentVolumeClaim:
            claimName: kvrag-kubeversion-rag-corpus
        - name: tmp
          emptyDir: {}
