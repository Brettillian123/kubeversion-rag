spec:
  schedule: "0 3 * * 1"
  # Ingestion is not idempotent against itself: two concurrent runs share one git
  # checkout directory and would check out different branches underneath each other.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      # 2 hours: a cold run clones twelve branches. Without a deadline a wedged git
      # fetch would hold the Forbid lock and silently suppress every later run.
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kubeversion-rag
            app.kubernetes.io/instance: kvrag
            app.kubernetes.io/component: ingest
        spec:
          restartPolicy: OnFailure
          serviceAccountName: kvrag-kubeversion-rag
          securityContext:
            fsGroup: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ingest
              image: ghcr.io/kubeversion-rag/jobs:ci
              imagePullPolicy: IfNotPresent
              args:
                - kubeversion_rag.cli
                - --min-version
                - "1.24"
                - --max-version
                - "1.35"
                - ingest
              envFrom:
                - configMapRef:
                    name: kvrag-kubeversion-rag-config
              env:
                # git resolves a config file under $HOME. The image's user has no home
                # directory, and with readOnlyRootFilesystem git fails to write its
                # lockfile -- a clone error that reads like a network problem.
                - name: HOME
                  value: /tmp
              resources:
                limits:
                  memory: 4Gi
                requests:
                  cpu: 500m
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: corpus
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: corpus
              persistentVolumeClaim:
                claimName: kvrag-kubeversion-rag-corpus
            - name: tmp
              emptyDir: {}
