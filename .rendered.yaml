apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kvrag-kubeversion-rag-qdrant
  labels:
    helm.sh/chart: kubeversion-rag-0.1.0
    app.kubernetes.io/name: kubeversion-rag
    app.kubernetes.io/instance: kvrag
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: qdrant
spec:
  # StatefulSet rather than Deployment because the index is durable state that must
  # survive a restart. A Deployment with a PVC would fight itself during a rollout:
  # the new pod cannot attach the volume until the old one releases it.
  serviceName: kvrag-kubeversion-rag-qdrant
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeversion-rag
      app.kubernetes.io/instance: kvrag
      app.kubernetes.io/component: qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeversion-rag
        app.kubernetes.io/instance: kvrag
        app.kubernetes.io/component: qdrant
    spec:
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.12.4
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          env:
            - name: QDRANT__SERVICE__HTTP_PORT
              value: "6333"
          # Qdrant serves /livez, /readyz and /healthz natively. Using its own
          # endpoints beats a TCP check, which would report healthy while the storage
          # engine is still recovering after a restart.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            # Generous: recovering a large index after an unclean shutdown is slow, and
            # a tight startup probe turns a slow recovery into a crash loop.
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
            # readOnlyRootFilesystem is on, so every path Qdrant writes to needs an
            # explicit mount. Snapshots go outside the storage dir, and the temp dir is
            # used during segment optimization -- missing either shows up as an opaque
            # I/O error under load rather than at startup.
            - name: snapshots
              mountPath: /qdrant/snapshots
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: snapshots
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
